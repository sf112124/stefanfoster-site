<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synth-folio · Stefan Foster</title>
<meta name="description" content="Stefan Foster's portfolio as a jungle sampler. Launch loops, drop breaks and throw the work into the circle; the sound blends it.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e120c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="synthkit/synth.css">
</head>
<body>
<div class="rig" id="rig">
  <header class="top">
    <a class="brand" href="./#ai-experiments" title="Back to the site"><b>SYNTH-FOLIO</b><span>// STEFAN FOSTER</span></a>
    <div class="tp">
      <button id="play" class="big" type="button" aria-pressed="false"><i class="tri"></i><span>PLAY</span></button>
      <span class="sep"></span>
      <span class="lbl">PATTERN</span>
      <button class="pre" data-pre="JUNGLE" type="button">JUNGLE</button>
      <button class="pre" data-pre="HALFTIME" type="button">HALF</button>
      <button class="pre" data-pre="DRILL" type="button">DRILL</button>
      <button id="chop" type="button" title="Shuffle the break">CHOP</button>
      <button id="clr" type="button" title="Empty every lane and stop every loop">CLEAR ALL</button>
    </div>
    <div class="tr">
      <span class="load done" id="load">LOADING SOUNDS</span>
      <button id="full" type="button">FULL SCREEN</button>
      <a href="./#ai-experiments" class="exit">EXIT</a>
    </div>
  </header>

  <aside class="crate panel">
    <div class="ph"><span>// CRATE</span><span class="dim">DRAG OR TAP INTO THE CIRCLE</span></div>
    <div class="clist" id="crate"></div>
    <div class="ph"><span>// ARCHIVES</span><span class="dim">LIVE</span></div>
    <canvas class="scopes" id="scopes"></canvas>
  </aside>

  <section class="mid" id="mid">
    <div class="stage" id="stage">
      <div class="platter" id="platter">
        <canvas id="vdj"></canvas>
        <div class="ring" id="ring" aria-hidden="true"></div>
        <div class="drop" id="drop"><b>DROP IT IN</b></div>
        <div class="hint" id="hint"><span>DRAG WORK FROM THE CRATE<br>OR YOUR OWN IMAGES AND VIDEOS<br>INTO THE CIRCLE</span></div>
      </div>
    </div>
    <div class="modes" id="modes"></div>
    <div class="modes looks" id="looks"></div>
    <div class="deck" id="deck"></div>
    <div class="read" id="read"></div>
  </section>

  <aside class="side panel">
    <div class="ph"><span>// PADS</span><span class="banks" id="banks"></span></div>
    <div class="pads" id="pads"></div>
    <div class="ph"><span>// FX</span><span class="dim">PUSH · THEY SPRING BACK</span></div>
    <div class="faders" id="faders"></div>
    <div class="ph"><span>// DJ</span><span class="dim">HOLD · SOUND AND PICTURE</span></div>
    <div class="holds" id="holds"></div>
    <div class="ph"><span>// CONTROL</span><span class="dim">DRAG · DOUBLE-CLICK RESETS</span></div>
    <div class="knobs" id="knobs"></div>
  </aside>

  <section class="seq panel" id="seq"></section>
</div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>
<script type="module" src="synthkit/main.js"></script>
</body>
</html>
