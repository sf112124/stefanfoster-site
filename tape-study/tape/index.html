<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stefan Foster — The Tape Room</title>
<!-- Tape Room, woodland study revision: separate version, see STUDY-README.md -->
<meta name="theme-color" content="#e9e1d0">
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.module.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
<style>
@font-face{font-family:"Geist";src:url(../vendor/fonts/geist.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#e9e1d0;color:#fff;overflow:hidden;overscroll-behavior:none}
body{font:500 11px/1.4 "Geist",ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.hot{cursor:pointer}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
body.nofilms .film{display:none!important}
.ui{position:fixed;z-index:2}
.chip,.top a,.top button,#actions>*{background:rgba(32,27,20,.74);color:#fff;padding:9px 12px;border-radius:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.top{top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}.top b{font-weight:650}.top .rr{display:flex;gap:8px}
#tip{left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));max-width:92vw;text-align:center;pointer-events:none;text-transform:none;letter-spacing:.02em;font-size:13px}
#prompt{left:50%;top:56%;transform:translateX(-50%);pointer-events:none;font-weight:650}
#actions{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw}
#actions>*{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;font-weight:650;background:rgba(32,27,20,.86)}
#actions>*:hover,#actions>*:focus-visible{background:#000}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
#stage:focus-visible{outline:none}
#joy{left:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:rgba(32,27,20,.3);border:1px solid rgba(255,255,255,.5);touch-action:none;display:none}
body.touch #joy{display:block}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.85)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* full-screen read / play view */
#reader{position:fixed;inset:0;z-index:8;background:rgba(236,228,212,.97);color:#221d16;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);-webkit-user-select:text;user-select:text}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.15)}
.rbar b{font-weight:650}
.rbar button,.rnav button{background:#221d16;color:#fff;border-radius:4px;min-height:44px;padding:0 18px;font-weight:650}
.rnav button:disabled{opacity:.3}
#rbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
#rbody canvas,#rbody img,#rbody video{max-width:100%;max-height:calc(100vh - 170px);height:auto;width:auto;box-shadow:0 6px 30px rgba(60,40,10,.3);background:#fff}
.rnav{display:flex;gap:14px;align-items:center}
.cap{text-transform:none;letter-spacing:.01em;font-size:14px;max-width:640px;text-align:center;opacity:.85}
.mac{width:min(980px,100%);flex:1;min-height:0;display:flex;background:#fbfaf7;border-radius:10px;box-shadow:0 10px 40px rgba(60,40,10,.3);overflow:hidden;text-transform:none;letter-spacing:.01em;font-size:15px}
.mac nav{flex:0 0 210px;background:#e9e6df;padding:14px 8px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.mac nav button{text-align:left;padding:10px 12px;border-radius:6px;min-height:44px;font-weight:550}
.mac nav button[aria-current=true]{background:#2f6fde;color:#fff}
.mac section{flex:1;overflow:auto;padding:18px 22px}
.mac h2{font-size:20px;font-weight:650;margin:0 0 4px}.mac p{margin:0 0 12px;line-height:1.5}
.mac .fic{background:#fff3c9;border-radius:6px;padding:10px 12px;font-size:13.5px}
.mac ul{list-style:none;padding:0;margin:0 0 14px}
.mac li{border-bottom:1px solid rgba(0,0,0,.08)}
.mac li a{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;color:#1b4fb3;font-weight:550}
.mac li a span{color:#6a655c;font-weight:400;text-align:right}
.mac li.note{padding:12px 4px}.mac li.note b{display:block;font-weight:650}
@media (max-width:700px){.mac{flex-direction:column}.mac nav{flex:0 0 auto;flex-direction:row;padding:8px}.mac nav button{white-space:nowrap}.top .rr a{display:none}#tip{font-size:12px;bottom:calc(128px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="The Tape Room: a woodland study with a TV, a VHS deck, tapes, a MacBook and an investigation wall. Drag to look, W A S D or arrow keys to walk, click or tap things. The buttons at the bottom do the same."></canvas>

<header class="ui top">
  <a href="/#about"><b>Stefan Foster</b></a>
  <span class="rr"><button id="mute" aria-pressed="false" title="Sound starts on your first click or key press">Sound on</button><a href="/">Exit to index</a></span>
</header>

<div id="prompt" class="ui chip" hidden></div>
<div id="tip" class="ui chip"></div>
<div id="actions" class="ui" role="toolbar" aria-label="Actions"></div>
<div id="joy" class="ui" aria-hidden="true"><i></i></div>

<div id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rtitle">
  <div class="rbar"><b id="rtitle"></b><button id="rback">Back</button></div>
  <div id="rbody"></div>
</div>
<div id="sr" class="sr" aria-live="polite"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
