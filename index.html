<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stefan Foster</title>
<meta name="description" content="Stefan Foster, creative art director in London. Film, AI and 3D.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="splash" id="splash" type="button" aria-label="Enter">
  <video class="sf" id="sf" src="media/reel.mp4" poster="media/reel-poster.webp" muted loop autoplay playsinline disablepictureinpicture disableremoteplayback preload="auto" aria-hidden="true"></video>
  <span class="enter mono">Enter</span>
</button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="dream" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence id="dreamTurb" type="fractalNoise" baseFrequency="0.01 0.013" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="0.6"/>
  </filter>
</svg>
<canvas class="heat" id="heat" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="top mono">
    <a class="chip" href="#" data-home><b>STEFAN FOSTER</b> :: CREATIVE ART DIRECTOR / 3D · AI</a>
    <nav class="links">
      <button class="snd" id="snd" type="button" aria-pressed="true"><i></i><span>SOUND</span></button>
      <button class="nite" id="nite" type="button" aria-pressed="false"><i></i><span>NIGHT</span></button>
      <a href="#about">ABOUT</a>
    </nav>
  </header>

  <main class="home" id="home">
    <nav class="wheel" id="wheel" aria-label="Projects"></nav>
    <div class="field" id="field" aria-label="All of Stefan's work. Hover a point to open a piece, click to go to it, grab one and wiggle it to play the sound."></div>
    <div class="label" id="label" aria-hidden="true"></div>
  </main>

  <footer class="bot mono">
    <span id="readout"></span>
    <span class="bar" aria-hidden="true"></span>
    <span id="mail"></span>
    <span>©2026</span>
  </footer>
</div>

<section class="view" id="view" aria-hidden="true" tabindex="-1">
  <div class="vbar mono">
    <a href="#" data-home>← Index</a>
    <span class="vt" id="vt"></span>
    <span class="vc"></span>
  </div>
  <div class="vin" id="vin"></div>
</section>

<button class="hole" id="hole" type="button" aria-label="Let the crawler out"><i></i><span class="mono">DO NOT OPEN</span></button>

<div class="lb" id="lb" hidden>
  <div class="lbbg" id="lbbg"></div>
  <div class="lbm" id="lbm"></div>
  <div class="lbbar">
    <div class="lbl"><span class="n mono" id="lbn"></span><span class="lbc" id="lbc"></span></div>
    <div class="lbpb" id="lbpb"><i id="lbp"></i></div>
    <div class="lbctl mono">
      <button type="button" id="lbl" aria-label="Previous">←</button>
      <button type="button" id="lbr" aria-label="Next">→</button>
      <button type="button" id="lbs" class="v">Sound on</button>
      <button type="button" id="lbf">Full screen</button>
      <button type="button" id="lbgo" class="go">See the project →</button>
      <button type="button" id="lbx">Close</button>
    </div>
  </div>
</div>

<script>
// the door always opens, even before (or without) the rest of the site loading
(function () {
  var s = document.getElementById("splash");
  function go() {
    if (window.__sf || document.body.classList.contains("entered")) return;
    document.body.classList.add("entered");
    setTimeout(function () { s.hidden = true; try { document.getElementById("sf").pause(); } catch (e) {} }, 1800);
  }
  s.addEventListener("click", go);
  addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") go(); });
})();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
