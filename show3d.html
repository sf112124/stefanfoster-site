<style>
:root{
  --lime:#c4ff3a; --deep:#14324d; --sand:#14324d; --sand-a:rgba(58,104,150,.66); --ink:#ffffff; --ink-soft:rgba(255,255,255,.72);
  --line:rgba(255,255,255,.2); --pink:#f0469c; --green:#7fd452; --yellow:#f5c826;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --sand-a:rgba(24,48,74,.74); }
}
:root[data-theme="dark"]{ --sand-a:rgba(24,48,74,.74); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:#cdb894;color:var(--ink);
  font-family:'Jost','Futura','Avenir Next',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 16px);pointer-events:none}
.mark{font-family:'Shrikhand','Cooper Black',Georgia,serif;font-size:clamp(26px,4vw,40px);line-height:1;color:#fff;
  text-shadow:0 2px 0 rgba(59,42,31,.35),0 6px 24px rgba(59,42,31,.25);letter-spacing:.005em}
.stripes{display:flex;flex-direction:column;gap:3px;width:clamp(120px,15vw,190px);margin:10px 0 10px}
.stripes i{display:block;height:4px;border-radius:4px}
.stripes i:nth-child(1){background:var(--pink)} .stripes i:nth-child(2){background:var(--yellow)} .stripes i:nth-child(3){background:var(--green)}
.status{display:inline-flex;gap:10px;align-items:baseline;background:var(--sand-a);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}
.status .soft{color:var(--ink-soft);font-weight:400;font-variant-numeric:tabular-nums}

.cams{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--sand-a);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.cams::-webkit-scrollbar{display:none}
.cams button{border:0;background:transparent;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.cams button.on{background:var(--ink);color:var(--sand)}
.focus{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--sand-a);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.focus button{display:flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:999px;padding:7px 13px 7px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.focus button i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.focus button[aria-checked="true"]{background:var(--ink);color:var(--sand)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 116px);
  font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);text-align:center;width:max-content;max-width:92vw;pointer-events:none}

.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);width:300px;
  max-height:calc(100% - 110px);overflow-y:auto;background:var(--sand-a);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:26px;padding:6px 18px 16px}
.panel section{padding:12px 0;border-bottom:1px solid var(--line)}
.panel section:last-child{border-bottom:0}
.panel h2{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 9px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}
.row label{font-size:14px;flex:0 0 auto;min-width:74px}
.row input[type=range]{flex:1;accent-color:var(--ink);min-width:0}
.row output{font-size:13px;color:var(--ink-soft);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;user-select:none;-webkit-user-select:none;touch-action:none}
.btn.solid{background:var(--ink);color:var(--sand)}
.btn.fire.on{background:#ff7a1a;border-color:#ff7a1a;color:#fff}
.balloon{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;margin:8px 0}
.balloon span{font-size:14px;font-weight:600}
.balloon select{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:13px}
.balloon select option{color:#3b2a1f}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid rgba(255,255,255,.7);border-radius:50%}
input[type=color]::-moz-color-swatch{border:2px solid rgba(255,255,255,.7);border-radius:50%}
.check{display:flex;align-items:center;gap:9px;font-size:14px;margin:6px 0}
.check input{accent-color:var(--ink);width:17px;height:17px}
.panelToggle{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px)}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);width:min(380px,56vw);display:none}
.hud .top{display:flex;justify-content:space-between;align-items:baseline;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);margin-bottom:6px}
.hud .top b{font-family:'Shrikhand','Cooper Black',Georgia,serif;font-weight:400;font-size:22px}
.hud .top span{font-size:14px;font-variant-numeric:tabular-nums}
.meter{height:15px;border-radius:999px;background:var(--sand-a);overflow:hidden;padding:2px}
.meter i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(to bottom,var(--pink) 0 33%,var(--yellow) 33% 66%,var(--green) 66% 100%);transition:width .15s linear}
.hud .look{margin-top:10px;display:flex;justify-content:center}
body.walk .hud{display:block}
@media (max-width:1100px){ .hud{top:calc(env(safe-area-inset-top,0px) + 124px);width:min(380px,84vw)} }

.stick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:124px;height:124px;border-radius:50%;
  background:var(--sand-a);display:none;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--ink)}
.poseBtn{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);width:92px;height:92px;border-radius:50%;
  border:0;background:var(--pink);color:#fff;font-family:'Shrikhand','Cooper Black',Georgia,serif;font-size:22px;display:none;touch-action:none}
body.walk.touch .stick, body.walk.touch .poseBtn{display:block}

.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);font-family:'Shrikhand','Cooper Black',Georgia,serif;
  font-size:clamp(40px,8vw,88px);color:#fff;text-shadow:0 4px 0 var(--pink),0 8px 0 var(--yellow),0 12px 0 var(--green),0 20px 40px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.btn.run{display:block;width:100%;margin-top:10px;padding:11px 14px;font-size:15px;border:0;color:#fff;
  background:linear-gradient(90deg,var(--pink),#f58a3a 50%,var(--yellow));text-shadow:0 1px 2px rgba(0,0,0,.2)}
body.is-live .btn.run{background:var(--ink);color:var(--sand);text-shadow:none}
.live{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;
  padding:6px 6px 6px 14px;border-radius:999px;background:rgba(20,14,10,.78);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
.live .dot{width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 10px #ff3b3b;animation:blink 1.2s infinite}
.live b{font-family:'Shrikhand','Cooper Black',Georgia,serif;font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live .soft{opacity:.6;font-size:13px}
.live #livePhase{font-size:13px;font-weight:600;padding-left:4px}
.live button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;padding:7px 12px;font-size:13px;font-weight:600}
@keyframes blink{50%{opacity:.25}}
body.is-live .live{display:flex}
body.is-live .hud{top:calc(env(safe-area-inset-top,0px) + 72px)}
.showUi{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;
  background:rgba(0,0,0,.25);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:13px}
body.clean .ui{display:none!important}
body.clean .showUi{display:block}

@media (max-width:760px){
  .panelToggle{display:block;background:var(--sand-a);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:transparent}
  .panel{display:none;top:auto;left:10px;right:10px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);max-height:56vh}
  body.panel-open .panel{display:block}
  .panel{bottom:calc(env(safe-area-inset-bottom,0px) + 118px);max-height:48vh}
  .status{font-size:13px}
  .live{top:calc(env(safe-area-inset-top,0px) + 116px);gap:7px}
  .live b{font-size:19px} .live .soft{display:none}
  body.is-live .hud{top:calc(env(safe-area-inset-top,0px) + 168px)}
}
@media (max-width:1100px) and (min-width:761px){ body.is-live .hud{top:calc(env(safe-area-inset-top,0px) + 176px)} }
@media (prefers-reduced-motion:reduce){ .live .dot{animation:none} }
@media (prefers-reduced-motion:reduce){ .toast,.meter i{transition:none} }

/* ---- From Earth to Sky overlay system ---- */
.brand{color:var(--lime)}
.mark{font-family:'Jost','Futura',system-ui,sans-serif;font-weight:700;font-size:clamp(17px,1.9vw,24px);letter-spacing:.12em;color:var(--lime);
  display:flex;align-items:center;gap:11px;text-shadow:0 1px 10px rgba(20,50,77,.35)}
.mark .logo{width:1.9em;height:1.45em;flex:0 0 auto;filter:drop-shadow(0 1px 6px rgba(20,50,77,.3))}
.coords{display:flex;gap:16px;margin:8px 0 10px;font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--lime);text-shadow:0 1px 2px rgba(20,50,77,.8),0 0 12px rgba(20,50,77,.5)}
.status{color:#fff}
.btn{border-color:rgba(255,255,255,.55);color:#fff}
.btn.solid{background:var(--lime);border-color:var(--lime);color:var(--deep)}
.btn.run{background:var(--lime);color:var(--deep);text-shadow:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
body.is-live .btn.run{background:transparent;border:1.5px solid var(--lime);color:var(--lime)}
.cams button{color:#fff}
.cams button.on,.focus button[aria-checked="true"]{background:var(--lime);color:var(--deep)}
.focus button{color:#fff}
.panel h2{color:var(--lime);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700}
.row input[type=range],.check input{accent-color:var(--lime)}
.balloon select{border-color:var(--line);color:#fff}
.panelToggle{color:var(--lime)!important;border-color:var(--lime)!important}
.hint{color:#fff;font-weight:500;letter-spacing:.02em;text-shadow:none;background:var(--sand-a);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:5px 12px;border-radius:999px;bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
.hint:empty{display:none}
.hud .top{color:var(--lime);text-shadow:0 1px 8px rgba(20,50,77,.5)}
.hud .top b{font-family:inherit;font-weight:700;font-size:13px;letter-spacing:.16em}
.hud .top b svg,.live b svg{height:1em;width:auto;display:block}
.meter i{background:var(--lime)}
.hud .top .bub{height:22px;display:flex}
.poseBtn{background:var(--lime);color:var(--deep);font-family:'Jost',system-ui,sans-serif;font-weight:800;letter-spacing:.1em;font-size:17px;text-transform:uppercase}
.stick i{background:var(--lime)}
.live{background:var(--sand-a);color:#fff}
.live .dot{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.live b{font-family:inherit;color:var(--lime);height:24px;display:flex;align-items:center}
.live b svg{height:22px}
.live button{background:rgba(255,255,255,.14)}
.bub{display:inline-block;color:var(--lime)}
.bub svg{display:block;height:100%;width:auto;overflow:visible}
.toast{font-family:inherit;text-shadow:none;color:var(--lime);height:clamp(44px,9vw,104px);
  filter:drop-shadow(0 4px 18px rgba(20,50,77,.35))}
.toast svg{height:100%;width:auto;max-width:92vw;display:block;overflow:visible}
.card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:linear-gradient(180deg,rgba(120,165,205,.72),rgba(150,190,215,.6));color:var(--lime)}
.card{z-index:40}
.card.show{opacity:1}
.ui{transition:opacity .6s}
body.carding .ui{opacity:0;pointer-events:none}
.card .stack{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px)}
.card .line{height:clamp(46px,13vh,150px);max-width:88vw}
.card .line svg{height:100%;width:auto;max-width:88vw;display:block;overflow:visible}
.card .logo{width:clamp(44px,6vh,70px);height:auto;margin:clamp(6px,2vh,26px) 0}
.card .kicker{font-weight:700;letter-spacing:.14em;font-size:clamp(20px,4.4vh,44px)}
.card .coord{position:absolute;top:50%;transform:translateY(-50%);font-weight:500;font-size:clamp(12px,1.6vw,22px);letter-spacing:.02em}
.card .coord.l{left:calc(env(safe-area-inset-left,0px) + 4vw)} .card .coord.r{right:calc(env(safe-area-inset-right,0px) + 4vw)}
@media (max-width:760px){ .card .coord{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:none} .card .line{height:clamp(40px,9vh,90px)} }
@media (prefers-reduced-motion:reduce){ .card{transition:none} }
.cranePad{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);width:260px;display:none;
  background:var(--sand-a);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:12px 16px 8px;color:#fff}
body.cam-crane .cranePad{display:block}
.cpTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.cpTop b{color:var(--lime);font-size:11px;letter-spacing:.16em;font-weight:700}
#craneAuto{padding:5px 12px;font-size:12px}
#craneAuto[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--deep)}
.cranePad .row label{min-width:52px}
@media (max-width:760px){ .cranePad{left:10px;right:10px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 158px)} body.cam-crane .hint{display:none} }
.seg{display:flex;gap:3px;flex:1;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:#fff;border-radius:999px;padding:5px 6px;font-size:12px;font-weight:600;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--lime);color:var(--deep)}
.osd{position:fixed;inset:0;pointer-events:none;display:none;color:var(--lime);font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.55)}
body.cam-fpv .osd{display:block}
.osd .cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--lime);border-radius:50%;opacity:.75}
.osd .cross::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--lime);border-radius:50%}
.osdL{position:absolute;left:calc(env(safe-area-inset-left,0px) + 18px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;letter-spacing:.14em}
.osdL i{display:block;width:10px;height:140px;border:1.5px solid var(--lime);border-radius:999px;position:relative;overflow:hidden}
.osdL b{position:absolute;left:0;right:0;bottom:0;background:var(--lime);height:30%}
.osdR{position:absolute;right:calc(env(safe-area-inset-right,0px) + 18px);top:50%;transform:translateY(-50%);text-align:right;font-size:15px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.osdTag{font-size:11px;letter-spacing:.2em}
.osdBtns{display:flex;gap:6px;margin-top:6px;pointer-events:auto}
.osdBtns button{border:1.5px solid var(--lime);background:rgba(20,50,77,.4);color:var(--lime);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.osdBtns button[aria-pressed="true"]{background:var(--lime);color:var(--deep);text-shadow:none}
body.cam-fpv .panel,body.cam-fpv .brand,body.cam-fpv .focus{display:none}
body.cam-fpv .panelToggle{display:none}
.fstick{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:130px;height:130px;border-radius:50%;border:2px solid rgba(196,255,58,.6);background:rgba(20,50,77,.25);display:none;touch-action:none}
.fstick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--lime)}
#fstickL{left:calc(env(safe-area-inset-left,0px) + 20px)} #fstickR{right:calc(env(safe-area-inset-right,0px) + 20px)}
body.cam-fpv.touch .fstick{display:block}
body.cam-fpv.touch .osdL{top:30%} body.cam-fpv.touch .osdR{top:30%}

@media (min-width:761px){ .panel{top:calc(env(safe-area-inset-top,0px) + 60px);max-height:calc(100% - 160px)} }
@media (max-width:760px){ .uiToggle{right:calc(env(safe-area-inset-right,0px) + 100px)} body.minimal .uiToggle{right:calc(env(safe-area-inset-right,0px) + 14px)} }

.keys{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:8px 0 4px}
.keys .btn{padding:6px 8px;font-size:12px}
.keys .btn.set{border-color:var(--lime);color:var(--lime)}
#keyRec{color:#ff8a8a;border-color:rgba(255,120,120,.6)}
.capture{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;align-items:center;

#recBtn i{width:12px;height:12px;border-radius:50%;background:#ff3b3b}

  crane.g.visible=camMode!=='crane';
  if(camMode==='fpv'){ fpvUpdate(FPV.raw); fpvCamera(dt); return; }
  if(camMode==='hand'){ handUpdate(Math.min(FPV.raw,.1)); return; }
  if(camMode==='crane'){ const f=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0), h=(keys.has('ArrowUp')?1:0)-(keys.has('ArrowDown')?1:0);
    const tl=(keys.has('KeyT')?1:0)-(keys.has('KeyG')?1:0); if(tl){ S.craneTilt=clamp(S.craneTilt+tl*25*dt*S.craneSpeed,-35,50); $('craneTilt').value=S.craneTilt; $('craneTiltOut').textContent=Math.round(S.craneTilt)+'°'; }
    if(f||h){ crane.auto=false; crane.sT-=f*7*dt*S.craneSpeed; crane.hT+=h*2.2*dt*S.craneSpeed; crane.move=null; } }
  let rate=3; tFov=50;
  if(camMode==='drone'){ rate=14; const o=orbit;
    tPos.set(Math.sin(o.pol)*Math.sin(o.az),Math.cos(o.pol),Math.sin(o.pol)*Math.cos(o.az)).multiplyScalar(o.r).add(o.target); tLook.copy(o.target);
    const gh=groundH(tPos.x,tPos.z)+2; if(tPos.y<gh) tPos.y=gh; }
  else if(camMode==='front'){ const rw=RUNWAYS[camRw]; tPos.copy(rw.A).addScaledVector(rw.dir,rw.len*.72).addScaledVector(rw.normal,RW_W/2+1.2); tPos.y=groundH(tPos.x,tPos.z)+1.45;
    tLook.copy(rw.A).addScaledVector(rw.dir,-BALLOON_BACK).addScaledVector(rw.normal,-1); tLook.y=groundH(tLook.x,tLook.z)+7; tFov=46; }
  else if(camMode==='end'){ const rw=RUNWAYS[camRw]; tPos.copy(rw.B).addScaledVector(rw.dir,6); tPos.y=groundH(tPos.x,tPos.z)+1.45;
    tLook.copy(rw.A).addScaledVector(rw.dir,-BALLOON_BACK); tLook.y=groundH(tLook.x,tLook.z)+8; tFov=34; }
  else if(camMode==='crane'){
    if(crane.auto && LIVE.on && LIVE.hero && LIVE.t<LIVE.T2 && LIVE.hero.ri!==camRw) setFocus(LIVE.hero.ri,false);
    const rw=RUNWAYS[camRw]; let tgt=null, best=-1e9;
    if(crane.auto){ const pool=LIVE.on&&LIVE.t<LIVE.T2&&LIVE.hero?[LIVE.hero]:activeWalkers();
      for(const w of pool){ if(!w.f.root.visible) continue; const p=w.f.root.position, rx=p.x-rw.A.x, rz=p.z-rw.A.z, sp=rx*rw.dir.x+rz*rw.dir.z, lat=rx*rw.normal.x+rz*rw.normal.z;
        const y=w.f.root.rotation.y, head=Math.sin(y)*rw.dir.x+Math.cos(y)*rw.dir.z;
        if(Math.abs(lat)<2.5 && sp>-(BALLOON_BACK+10) && sp<rw.len && head>.3 && sp>best){ best=sp; tgt=w; } }
      if(tgt){ crane.sT=clamp(best+9,craneMin(rw),craneMax(rw)); crane.hT=best<-4?3.2:1.0; } }
    if(crane.lastRw!==camRw){ crane.lastRw=camRw; crane.s=crane.sT=clamp(crane.sT,craneMin(rw),craneMax(rw)); }
    if(crane.move){ const m=crane.move; m.t+=dt; const k=smooth(0,1,m.t/m.dur);
      crane.s=crane.sT=m.a.s+(m.b.s-m.a.s)*k; crane.h=crane.hT=m.a.h+(m.b.h-m.a.h)*k;
      if(S.keyTilt!==false && m.a.tilt!=null && m.b.tilt!=null){ S.craneTilt=m.a.tilt+(m.b.tilt-m.a.tilt)*k; syncTilt(); }
      if(m.t>=m.dur){ crane.move=null; if(m.rec && REC.on) stopRec(); } }
    crane.sT=clamp(crane.sT,craneMin(rw),craneMax(rw)); crane.hT=clamp(crane.hT,.4,8);
    crane.s+=(crane.sT-crane.s)*Math.min(1,dt*(crane.auto?3.2:5)); crane.h+=(crane.hT-crane.h)*Math.min(1,dt*(crane.auto?1.4:5));
    tPos.copy(rw.A).addScaledVector(rw.dir,crane.s); tPos.y=groundH(tPos.x,tPos.z)+crane.h;
    if(tgt){ const p=tgt.f.root.position; tLook.set(p.x,p.y+1.25,p.z); }
    else { tLook.copy(tPos).addScaledVector(rw.dir,-16); tLook.y=tPos.y+(1.4-crane.h)*.25; }
    { const hd=Math.hypot(tLook.x-tPos.x,tLook.z-tPos.z), base=Math.atan2(tLook.y-tPos.y,hd), a=clamp(base+S.craneTilt*Math.PI/180,-1.4,1.4); tLook.y=tPos.y+Math.tan(a)*hd; }
    tFov=camera.fov; rate=12; }
  else if(camMode==='follow'){ let w=null; const mine=activeWalkers().filter(x=>x.ri===camRw && x.f.root.visible); for(let i=mine.length-1;i>=0;i--){ if(mine[i].state!=='back'){ w=mine[i]; break; } } if(!w && mine.length) w=mine[mine.length-1];
    if(w){ const p=w.f.root.position, y=w.f.root.rotation.y, fx=Math.sin(y), fz=Math.cos(y);
      tPos.set(p.x+fx*4.2+fz*1.1,p.y+.55,p.z+fz*4.2-fx*1.1); tLook.set(p.x,p.y+1.35,p.z); tFov=40; }
    else { const rw=RUNWAYS[camRw]; tPos.copy(rw.B).addScaledVector(rw.dir,5); tPos.y=groundH(tPos.x,tPos.z)+.8; tLook.copy(rw.A); tLook.y=1.6; tFov=40; } rate=4; }
  else if(camMode==='lineup' && lineup){ const half=(lineup.n-1)*LSP/2; lineupX=clamp(lineupX,-half,half);
    tPos.set(lineupX,lineup.gy+1.25,LZ+5.4); tLook.set(lineupX,lineup.gy+1.05,LZ); tFov=38; rate=8;
    lineup.figs.forEach((f,i)=>{ f.head.rotation.y=Math.sin(T*.4+i)*.15; }); }
  else if(camMode==='film'){ const r=filmCam(dt); tFov=r.fov; rate=r.rate; if(r.cut){ camera.fov=r.fov; camera.updateProjectionMatrix(); } }
  else if(camMode==='walk' && player){ const fx=Math.sin(pYaw), fz=Math.cos(pYaw);
    if(FLY.on){ const cp=Math.cos(FLY.pitchF*.8), d=V3(Math.sin(FLY.yaw)*cp,Math.sin(FLY.pitchF*.8),Math.cos(FLY.yaw)*cp), rt=V3(Math.cos(FLY.yaw),0,-Math.sin(FLY.yaw));
      const cd=7.5+FLY.speed*.08; tPos.set(pPos.x,pPos.y+1,pPos.z).addScaledVector(d,-cd).addScaledVector(rt,-1.6); tPos.y+=1.2;
      const gh=groundH(tPos.x,tPos.z)+wallH(tPos.x,tPos.z)+.6; if(tPos.y<gh) tPos.y=gh;
      tLook.set(pPos.x,pPos.y+1,pPos.z).addScaledVector(d,12); rate=3.2; }
    else { tPos.set(pPos.x-fx*5.4,pPos.y+2.3,pPos.z-fz*5.4); tLook.set(pPos.x+fx*3,pPos.y+1.3,pPos.z+fz*3); rate=5; } }
  const k=1-Math.exp(-dt*rate); camPos.lerp(tPos,k); camLook.lerp(tLook,k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  if(Math.abs(camera.fov-tFov)>.05){ camera.fov+=(tFov-camera.fov)*k; camera.updateProjectionMatrix(); }
  sky.position.copy(camera.position);
}

const ptrs=new Map(); let pinch=0;
const pinchDist=()=>{ const a=[...ptrs.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1; };
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,btn:e.button}); if(ptrs.size===2) pinch=pinchDist(); });
canvas.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(camMode==='lineup'){ if(ptrs.size===1) lineupX-=dx*.012; return; }
  if(camMode==='walk' && FLY.on){ if(ptrs.size===1){ FLY.tYaw-=dx*.004; FLY.tPitch=clamp(FLY.tPitch-dy*.004,-1.2,1.25); } return; }
  if(camMode==='hand'){ if(ptrs.size===1){ HAND.tYaw-=dx*.004; HAND.tPitch=clamp(HAND.tPitch-dy*.004,-1.2,1.2); } return; }
  if(camMode==='fpv'){ if(FPV.mode!=='acro' && ptrs.size===1){ FPV.heading-=dx*.0045; FPV.pitch=clamp(FPV.pitch-dy*.0045,-1.5,1.5); } return; }
  if(camMode==='crane'){ if(ptrs.size===1){ crane.auto=false; crane.move=null; crane.sT+=dy*.06*S.craneSpeed; crane.hT-=dx*.012*S.craneSpeed; } return; }
  if(camMode!=='drone') return;
  if(ptrs.size===1){ if(p.btn===2||e.shiftKey){ const k=orbit.r*.0016, a=orbit.az;
      orbit.target.x+=-Math.cos(a)*dx*k-Math.sin(a)*dy*k; orbit.target.z+=Math.sin(a)*dx*k-Math.cos(a)*dy*k;
      const tl=Math.hypot(orbit.target.x,orbit.target.z+30); if(tl>260){ orbit.target.x*=260/tl; } }
    else { orbit.az-=dx*.005; orbit.pol=clamp(orbit.pol-dy*.004,.12,1.5); } }
  else if(ptrs.size===2){ const d=pinchDist(); orbit.r=clamp(orbit.r*pinch/d,12,480); pinch=d; } });
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=0; };

  PERF.t+=raw; PERF.n++; if(PERF.t>1.2){ const ms=PERF.t/PERF.n*1000, pr=renderer.getPixelRatio();
    if(ms>30 && pr<=1 && POST){ if(POST.bokeh&&!POST.noDof&&POST.bokeh.enabled) POST.noDof=true; else if(POST.sao&&POST.sao.enabled) POST.sao.enabled=false; else if(POST.bloom&&POST.bloom.enabled&&ms>40) POST.bloom.enabled=false; }
    if(ms>30 && pr>1) renderer.setPixelRatio(Math.max(1,pr-.25)); else if(ms<15 && pr<PERF.max) renderer.setPixelRatio(Math.min(PERF.max,pr+.25)); PERF.t=0; PERF.n=0; }
  if(playing && LIVE.on) liveUpdate(dt*S.speed,dt);
  if(playing && !LIVE.on && S.solo) soloUpdate(dt*S.speed,dt);
  if(playing && !LIVE.on && !S.solo){ const sd=dt*S.speed; showT+=sd;
    for(const e of events){ if(!e.fired && showT>=e.t){ e.fired=true; fired++; walkers.push(new Walker(e.ri,e.look)); } }
    for(const w of walkers){ w.update(sd); if(w.state!=='done') flashNear(w.ri,w.s,2.4,dt*2.2); }
    walkers=walkers.filter(w=>{ if(w.state==='done'){ disposeFigure(w.f); return false; } return true; });
    if(finaleT<0 && showT>showEnd){ finaleT=0; toast('Finale'); }
  }
  if(finaleT>=0){ finaleT+=dt; flashAll(dt*3); if(finaleT>8) restartShow(); }
  if(inflating){ S.inflate=Math.min(1,S.inflate+dt/9); inflateEl.value=S.inflate; $('inflateOut').textContent=Math.round(S.inflate*100)+'%';
    if(S.inflate>=1){ inflating=false; save(); } }
  const bt=(burnHold||finaleT>=0||inflating||stopperT>0||(LIVE.on&&LIVE.t>LIVE.END-18))?1:0; burn+=(bt-burn)*Math.min(1,dt*8);
  balloons.forEach(b=>b.update(T,S.inflate,S.wind,burn,S.lift));
  if(camMode==='walk' && player) updatePlayer(dt);
  updatePhones(dt); updateHeads(dt); updateSkyLife(dt); updateCamera(dt); updateDust(dt);
  uiT-=dt; if(uiT<=0){ uiT=.25; syncCranePad();
    if(LIVE.on){ const ph=LIVE.t<LIVE.T2?('Hero look '+Math.max(1,LIVE.heroN)+' of 6'):LIVE.t<LIVE.T3?'Model walks':'Finale';
      setBubble($('liveTime'),fmtT(LIVE.t)); $('livePhase').textContent=ph; $('phase').textContent=ph; $('clock').textContent='Look '+LIVE.count+' of '+TOTAL_LOOKS; }
    else if(S.solo){ $('phase').textContent='KV practice, '+RUNWAYS[camRw].name.toLowerCase(); $('clock').textContent='Look '+(SOLO.look||1)+' of '+SOLO_LIST[camRw].length+(SOLO.state==='ready'?', ready':''); }
    else { $('phase').textContent=finaleT>=0?'Finale':showT<58?'Opening, hero looks':'Full show'; $('clock').textContent='Look '+fired+' of '+TOTAL_LOOKS; } }
  renderView(); afterRender(); if(REC.on){ REC.t+=raw; $('recTime').textContent='REC '+fmtT(REC.t); } requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
