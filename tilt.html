<style>
  @font-face { font-family: "Geist"; font-weight: 100 900; font-display: block;
    src: url(/vendor/fonts/geist.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0d12; }
  body {
    color: #fff;
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ink { pointer-events: none; }
  .readout { position: fixed; left: 50%; top: calc(50% + 30px); text-align: center; pointer-events: none; will-change: transform; }
  .big { display: none; font-size: clamp(40px, 13vw, 76px); font-weight: 600; letter-spacing: -0.055em; line-height: .9; white-space: nowrap; opacity: .92; }
  .sub { margin-top: 0; font-size: 12px; opacity: .6; min-height: 1.2em; white-space: nowrap; }
  .gate { position: fixed; inset: 0; cursor: pointer; transition: opacity .8s, transform .8s; }
  .gate.gone { opacity: 0; pointer-events: none; transform: scale(1.03); }
  .gate .body { position: absolute; left: 0; right: 0; top: 46%; text-align: center; padding: 0 28px; }
  .gate .steps { font-size: 15px; line-height: 1.4; letter-spacing: -0.015em; opacity: .86; text-wrap: balance; }
  .gate .steps span { white-space: nowrap; }
  .gate .steps .strum { display: block; margin-top: 6px; opacity: .7; white-space: normal; }
  .gate .go { display: inline-block; margin-top: 26px; font-size: 13px; font-weight: 500; letter-spacing: -0.005em;
              padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.45);
              background: rgba(255,255,255,.06); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
              animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 50% { border-color: rgba(255,255,255,.85); background: rgba(255,255,255,.12); } }
  .gate .foot { position: absolute; left: 0; right: 0; bottom: max(22px, env(safe-area-inset-bottom)); text-align: center; font-size: 11px; opacity: .45; letter-spacing: .02em; }
  .toast { position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top)); z-index: 5; transform: translate(-50%, -16px); opacity: 0;
           font-size: 12px; padding: 9px 14px; border-radius: 999px; background: rgba(14,16,22,.5); border: 1px solid rgba(255,255,255,.12);
           backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: opacity .5s, transform .5s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .desk { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 40px; }
  .desk h2 { font-size: 64px; font-weight: 600; letter-spacing: -0.055em; line-height: .9; }
  .desk p { margin-top: 16px; font-size: 15px; opacity: .7; }
  .qr { margin: 32px auto 0; width: 156px; height: 156px; padding: 12px; background: #fff; border-radius: 16px; }
  .qr img, .qr canvas { position: static; width: 132px !important; height: 132px !important; }
  body.thumb .gate, body.thumb .desk, body.thumb .readout { display: none !important; }
  body.desktop .readout, body.desktop .gate, body.desktop #ink, body.desktop .controls, body.thumb .controls { display: none; }
  body.desktop .desk { display: grid; }
  .controls { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px;
              padding: 0 16px; opacity: 0; transform: translateY(10px); transition: opacity .8s .4s, transform .8s .4s; pointer-events: none; }
  .controls.on { opacity: 1; transform: none; pointer-events: auto; }
  .controls button { font: inherit; color: #fff; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .glass { background: rgba(14,16,22,.46); border: 1px solid rgba(255,255,255,.13);
           backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); }

  .dock { display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px; }
  .tab { height: 44px; padding: 0 18px; border-radius: 999px; background: transparent; display: inline-flex; align-items: center; gap: 8px;
         font-size: 14px !important; font-weight: 500; letter-spacing: -0.01em; transition: background .25s; }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.28); transition: background .3s, box-shadow .3s; }
  .tab.live .dot { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.9); }
  .tab.open { background: rgba(255,255,255,.14); }
  .recb { height: 44px; min-width: 44px; margin-left: 4px; padding: 0 15px; border-radius: 999px; background: rgba(255,255,255,.1) !important;
          display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-size: 14px !important; font-weight: 500; font-variant-numeric: tabular-nums; transition: background .25s; }
  .recb i { width: 14px; height: 14px; border-radius: 50%; background: #ff4d5e; transition: border-radius .25s, transform .25s; }
  .recb.on { background: rgba(255,77,94,.24) !important; }
  .recb.on i { border-radius: 3px; transform: scale(.86); animation: blink 1s steps(2) infinite; }
  .recb span:empty { display: none; }
  @keyframes blink { 50% { opacity: .35; } }

  .sheet { display: none; width: min(100%, 340px); padding: 6px; border-radius: 24px; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sheet.open { display: grid; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .chip { position: relative; overflow: hidden; height: 48px; border-radius: 18px; background: rgba(255,255,255,.08);
          font-size: 13.5px !important; font-weight: 500; letter-spacing: -0.01em; transition: background .25s, color .25s, opacity .25s, transform .12s; }
  .chip:active { transform: scale(.97); }
  .chip.on { background: rgba(255,255,255,.93); color: #0b0d12 !important; }
  .chip:disabled { opacity: .3; }
  .chip.wait { animation: wait .5s ease-in-out infinite alternate; }
  .chip.recording { background: rgba(255,77,94,.35); }
  .chip.recording::before { content: ""; position: absolute; inset: 0; width: calc(var(--p, 0) * 100%); background: rgba(255,77,94,.75); }
  .chip.recording span { position: relative; }
  .chip.armed { background: rgba(255,255,255,.26); }
  .chip.hit { background: rgba(255,255,255,.55); transition: none; }
  .chip .x { position: absolute; right: 0; top: 0; bottom: 0; width: 38px; display: none; place-items: center; font-size: 17px; opacity: .55; }
  .chip.has .x { display: grid; }
  .chip.has { padding-right: 22px; }
  @keyframes wait { to { background: rgba(255,255,255,.24); } }

  .take { display: none; width: min(100%, 340px); padding: 8px; border-radius: 24px; flex-direction: column; gap: 6px; }
  .take.open { display: flex; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
  .take .top { display: flex; align-items: center; gap: 10px; padding-right: 8px; }
  .play { width: 44px; height: 44px; flex: none; border-radius: 50%; background: #fff !important; display: grid; place-items: center; }
  .play svg { width: 16px; height: 16px; fill: #0b0d12; }
  .take canvas { position: static; flex: 1; width: auto; height: 40px; min-width: 0; }
  .take .t { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; }
  .take .row { display: grid; grid-template-columns: 1fr 1fr 64px; gap: 6px; }
  .take .row .chip { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .take .row svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .take .row .bin.sure { background: rgba(255,77,94,.8); }
</style>

<div class="controls" id="controls">

    <div class="top">

<div class="gate" id="gate">
  <div class="body">
    <p class="steps" aria-label="Tilt"><span>Tilt your phone backwards</span> <span>and forwards to control the music.</span><span class="strum"><span>Swipe across to strum, hold higher for drama,</span> <span>shake to ripple.</span></span></p>
    <span class="go">Tap to begin</span>
  </div>
  <div class="foot">Sound on</div>
</div>

<div class="desk">
  <div>
    <div style="height:34vh"></div>
    <p>Made for your phone. Scan to play.</p>
    <div class="qr" id="qr"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  const clamp01 = x => Math.min(Math.max(x, 0), 1);
  const smooth = x => { const c = clamp01(x); return c * c * (3 - 2 * c); };
  const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
  const NOTE = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
  const $ = id => document.getElementById(id);

  const THUMB = location.search.includes('thumb');
  if (THUMB) document.body.classList.add('thumb');
  const isPhone = !THUMB && matchMedia('(pointer: coarse)').matches && 'DeviceMotionEvent' in window;
  if (!isPhone && !THUMB) {
    document.body.classList.add('desktop');
    try { new QRCode($('qr'), { text: location.href, width: 132, height: 132, colorDark: '#0b0d12', colorLight: '#ffffff' }); } catch (_) {}
  }

  // ---------- the progression ----------
  const PROG = [
    ['Am(add9)',  45, [52, 57, 59, 60, 64, 69, 71], 0.45],
    ['Fmaj9♯11',  41, [48, 57, 64, 67, 69, 71, 79], 0.65],
    ['Cmaj9/E',   40, [59, 62, 67, 71, 72, 74, 79], 0.75],
    ['E♭maj7♯11', 39, [55, 58, 62, 63, 69, 70, 74], 0.85],
    ['Dm11',      38, [57, 60, 65, 67, 69, 72, 76], 0.6],
    ['B♭maj7♯11', 46, [57, 62, 64, 65, 69, 74, 76], 0.8],
    ['E7♭9♭13',   40, [56, 60, 62, 65, 68, 72, 77], 1.0],
    ['Amaj9',     45, [52, 61, 64, 68, 71, 76, 85], 1.0],
  ].map(([name, bass, up, inten]) => {
    const all = [bass, ...up];
    const pcs = [...new Set(all.map(m => m % 12))];
    // the lead's notes: this chord's tones across two octaves, so every note you land on belongs
    const lead = []; for (let m = 62; m <= 86; m++) if (pcs.includes(m % 12)) lead.push(m);
    return { name, inten, lead, pcs, notes: [bass, ...up.slice().sort((a, b) => a - b)].map(m => Math.log2(midiHz(m))) };
  });
  const chordAt = i => PROG[((i % PROG.length) + PROG.length) % PROG.length];

  // ---------- state ----------
  let ctx = null, bus = null, idleGain = null, analyser = null, tbuf = null, fbuf = null;
  let chords = null, lead = null;
  let pos = 0, vel = 0, target = 0, lastMove = 0, lastT = performance.now();
  let gSign = -1, motionSeen = false;
  let fallT = [0, 1], fallFast = [0, 1];               // where "down" is on screen
  const slime = { x: 0, y: 1, vx: 0, vy: 0 };          // the slime's slow, wobbly version of that
  let exprT = 0.4, expr = 0.4;                          // tilt-back expression 0..1
  let level = 0, low = 0, hue = 0, hueT = 0, inten = 0.6, intenT = 0.6, textRot = 0;
  let slideNow = 0;
  { const m = location.search.match(/thumb=(\d)/); if (m) slideNow = +m[1]; }
  let bloom = 0, rip = [0, 0, 99], lastStrum = 0, lastIndex = 0;
  // People rarely hold a phone perfectly upright or perfectly flat, so the sweep runs from about 20 degrees
  // back (how you naturally hold it) to about 58 degrees back, and anything past either end counts as the end.
  const TILT_FROM = 22 * Math.PI / 180, TILT_TO = 58 * Math.PI / 180;
  let master = null, duck = null, outNode = null, carve = null, liveTrim = null, grab = null, voiceFx = null;
  window.__tiltAudio = () => ({ ctx, master: outNode, voice: voiceFx, music: comp0 });   // lets a test harness record the output
  let chaos = 0, dramaT = 0, drama = 0, fxSend = null, vibAmt = null;
  // one palette per chord, dark core to bright edge, in the same order as the progression
  const PALS = [
    [[.07,.09,.13],[.27,.22,.55],[.58,.33,.86],[.96,.30,.62],[1,.52,.38],[.97,.86,.42]],   // Am(add9): violet, hot pink, butter
    [[.05,.09,.12],[.12,.30,.42],[.40,.55,.80],[.78,.62,.90],[1,.72,.66],[1,.90,.74]],     // Fmaj9#11: dusk teal, lilac, peach
    [[.06,.10,.16],[.18,.32,.70],[.42,.56,.98],[.98,.70,.48],[1,.55,.25],[1,.86,.55]],     // Cmaj9/E: periwinkle and molten orange
    [[.03,.07,.07],[.06,.26,.26],[.20,.52,.50],[.55,.40,.80],[.90,.35,.70],[.98,.80,.85]], // Ebmaj7#11: deep sea green, orchid
    [[.09,.05,.07],[.35,.12,.22],[.70,.25,.35],[.95,.48,.40],[1,.70,.45],[1,.90,.70]],     // Dm11: oxblood, rose, amber
    [[.03,.04,.12],[.08,.14,.55],[.20,.32,.90],[.75,.30,.55],[.98,.28,.25],[1,.65,.45]],   // Bbmaj7#11: cobalt into red
    [[.06,.02,.06],[.30,.04,.20],[.62,.10,.35],[.90,.20,.30],[1,.45,.20],[1,.78,.40]],     // E7b9b13: blood and fire
    [[.10,.10,.18],[.40,.40,.80],[.75,.60,.95],[1,.70,.80],[1,.85,.70],[1,.97,.88]],       // Amaj9: everything lifts into light
  ];
  const palNow = PALS[((Math.round(slideNow) % 8) + 8) % 8].map(c => c.slice());
  const palFlat = new Float32Array(18);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;

  // ---------- phone motion ----------
  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.y == null) return;
    const mag = Math.hypot(g.x || 0, g.y || 0, g.z || 0);
    if (mag < 2) return;
    if (!motionSeen) { motionSeen = true; gSign = g.y < 0 ? -1 : 1; }
    const fx = (g.x || 0) * -gSign, fy = (g.y || 0) * -gSign;          // fall direction in the screen's plane (y up)
    const m2 = Math.hypot(fx, fy);
    if (m2 > 0.2 * mag) {
      fallT = [fx / m2, -fy / m2];                                       // screen coords, y down
    }
    // shake: slosh the slime, and a hard shake strums the chord
    const a = e.acceleration;
    if (a && a.x != null) {
      const sx = (a.x || 0) * -gSign, sy = (a.y || 0) * gSign;
      slime.vx += sx * 0.05; slime.vy += sy * 0.05;
      const am = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
      if (am > 13 && ctx && performance.now() - lastStrum > 900) { lastStrum = performance.now(); throwRipple(); }
    }
    const back = ((g.z || 0) * gSign) / mag;                             // + when the screen tilts back toward the sky
    // the sweep: phone upright and facing you is 0, lying back with the screen to the ceiling is 1
    const upr = ((g.y || 0) * gSign) / mag;
    target = clamp01((Math.atan2(Math.abs(back), upr) - TILT_FROM) / (TILT_TO - TILT_FROM));
    exprT = 0.6;
  }

  // ---------- audio ----------
  function makeReverb(seconds = 3.4) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    const c = ctx.createConvolver(); c.buffer = buf; return c;
  }

  function startAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    idleGain = ctx.createGain();
    bus = ctx.createGain(); bus.gain.value = 0.7;
    const reverb = makeReverb(), wet = ctx.createGain(); wet.gain.value = 0.5;
    bus.connect(idleGain); bus.connect(reverb); reverb.connect(wet); wet.connect(idleGain);
    duck = ctx.createGain(); carve = ctx.createBiquadFilter(); carve.type = 'peaking'; carve.frequency.value = 2600; carve.Q.value = 0.8; carve.gain.value = 0;
    duck.connect(carve); carve.connect(comp);                 // everything melodic runs through here, so the kick can push it down
    idleGain.connect(duck); master = ctx.createGain(); comp.connect(master);
    const limiter = ctx.createDynamicsCompressor(); limiter.threshold.value = -4; limiter.knee.value = 2; limiter.ratio.value = 20; limiter.attack.value = 0.002; limiter.release.value = 0.12;
    const trim = ctx.createGain(); trim.gain.value = 0.8; liveTrim = trim;
    master.connect(trim); trim.connect(limiter); limiter.connect(ctx.destination); outNode = limiter;
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.6;
    comp.connect(analyser);
    tbuf = new Float32Array(analyser.fftSize); fbuf = new Uint8Array(analyser.frequencyBinCount);
    const vibLfo = ctx.createOscillator(); vibLfo.frequency.value = 6.8;
    vibAmt = ctx.createGain(); vibAmt.gain.value = 0;                  // in cents, set by how far you've slid up
    vibLfo.connect(vibAmt); vibLfo.start();
    chords = Chords();
    harpLp = ctx.createBiquadFilter(); harpLp.type = 'lowpass'; harpLp.frequency.value = 5000; harpLp.Q.value = 0.5;
    const harpOut = ctx.createGain(); harpOut.gain.value = 1.0;
    const harpRev = makeReverb(2.8), harpWet = ctx.createGain(); harpWet.gain.value = 0.42;
    harpLp.connect(harpOut); harpOut.connect(duck); harpOut.connect(harpRev); harpRev.connect(harpWet); harpWet.connect(duck);
    // the ripple: ping-pong echoes darkening as they repeat, plus a long cathedral reverb
    fxSend = ctx.createGain(); fxSend.gain.value = 0;
    bus.connect(fxSend); harpOut.connect(fxSend);
    const dl = ctx.createDelay(2), dr = ctx.createDelay(2); dl.delayTime.value = 0.31; dr.delayTime.value = 0.47;
    const fbk = ctx.createGain(); fbk.gain.value = 0.62;
    const dark = ctx.createBiquadFilter(); dark.type = 'lowpass'; dark.frequency.value = 2600;
    const pl = ctx.createStereoPanner(); pl.pan.value = -0.85; const pr = ctx.createStereoPanner(); pr.pan.value = 0.85;
    const echo = ctx.createGain(); echo.gain.value = 0.55;
    fxSend.connect(dl); dl.connect(pl); pl.connect(echo); dl.connect(dr); dr.connect(pr); pr.connect(echo);
    dr.connect(dark); dark.connect(fbk); fbk.connect(dl);
    const hall = makeReverb(6.5), hallGain = ctx.createGain(); hallGain.gain.value = 0.7;
    fxSend.connect(hall); hall.connect(hallGain);
    echo.connect(hall);
    echo.connect(duck); hallGain.connect(duck);
    comp0 = comp;
    noiseLong = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    { const d = noiseLong.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    startBeatClock();
    const nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
    const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length);
    noiseBuf = nb;
  }

  // ---------- the harp ----------
  let harpLp = null, noiseBuf = null, comp0 = null, noiseLong = null;
  const STRINGS = 12;

  const GRID = {
    kick:  'x...........x...|..x.x.......x...|x...........x...|..x.x.......x...',
    bass:  'x...........x...|..x.x.......x...|x...........x...|..x.x.......x...',
    snare: '........x.......|........x.......|........x.......|........x.......',
    open:  '............x...|............x...|............x...|............x...',
    clap:  '........x.......|........x.......|........x.......|........x...x...',
    hat:   'x.x.x.x.x.x.2222|xxxxxxxx22xx3332|........xxxx2222|x.x.x.x.xxxxxx33',
    clapX2:'........x.......|....x...x...x...|........x.......|x...x...x.......',   // Double swaps in these claps
    hatX2: 'xxxxxxxxxxxx2222|xxxxxxxx22xx3332|........xxxx2222|xxxxxxxxxxxxxx33',   // and these hats

  function playStep(clk, t) {

  function syncButtons() {

      b.disabled = !beat.on && !beat.pending;

  document.querySelectorAll('#controls button[data-c]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();

    const c = b.dataset.c;

  // ---------- the voice: hard autotune locked to the chord, a vocoder you hold, vocal reverb and echo ----------
  const TUNER = `
  class Tuner extends AudioWorkletProcessor {
    constructor() {
      super();
      this.sr = sampleRate; this.N = 8192; this.buf = new Float32Array(this.N); this.w = 0;
      this.dec = 4; this.dN = 1024; this.dbuf = new Float32Array(this.dN); this.dw = 0; this.dc = 0; this.lp = 0;
      this.blocks = 0; this.ratio = 1; this.ratioT = 1; this.phase = 0; this.win = 600; this.winT = 600;

      this.x = new Float32Array(this.W + this.maxLag + 2); this.d = new Float32Array(this.maxLag + 2);

    }
    detect() {

      let st = (this.dw - W - M + L * 8) % L, e = 0;
      for (let i = 0; i < W + M; i++) x[i] = this.dbuf[(st + i) % L];
      for (let i = 0; i < W; i++) e += x[i] * x[i];
      if (e / W < 2e-5) return 0;
      let run = 0; d[0] = 1;
      for (let t = 1; t <= M; t++) { let s = 0; for (let i = 0; i < W; i++) { const q = x[i] - x[i + t]; s += q * q; } run += s; d[t] = run > 0 ? s * t / run : 1; }

      for (let t = this.minLag; t < M; t++) { if (d[t] < 0.14) { while (t + 1 < M && d[t + 1] < d[t]) t++; best = t; break; } }

      let bestM = Math.round(midi), bd = 99;
      for (let m = Math.round(midi) - 6; m <= Math.round(midi) + 6; m++) {
        if (!this.allowed.includes(((m % 12) + 12) % 12)) continue;
        const dd = Math.abs(m - midi); if (dd < bd) { bd = dd; bestM = m; }
      }
      return Math.pow(2, (bestM - midi) / 12);
    }

      let p = this.w - delay; while (p < 0) p += this.N;
      const i = Math.floor(p), f = p - i, a = this.buf[i % this.N], b = this.buf[(i + 1) % this.N];

        this.phase += (1 - this.ratio) / this.win;
        this.phase -= Math.floor(this.phase);

        out[n] = this.read(this.phase * this.win + 8) * g1 + this.read(p2 * this.win + 8) * g2;
        this.w = (this.w + 1) % this.N;
      }

      { let f = Math.pow(2, chordNow.notes[0]); while (f > 62) f /= 2; bassHz = f; }
      $('sub').textContent = r.f > 0.04 && r.f < 0.96 ? r.A.name + '  →  ' + r.B.name : '';
      hueT = slideNow * 0.137; intenT = r.it;
      if (r.index !== lastIndex) { lastIndex = r.index; bloom = 1; }
      tuneStrings(chordNow);
    }
    drawInk(chordNow, now);

    hue += (hueT - hue) * 0.03;
    inten += (intenT - inten) * 0.05;

    // keep the chord name upright in the real world
    const want = Math.atan2(-slime.x, slime.y);
    let dRot = want - textRot; dRot = Math.atan2(Math.sin(dRot), Math.cos(dRot));
    textRot += dRot * 0.08;
    // and float it toward the real-world top, out of the circle's way
    const fr2 = worldFrame();
    const up = 0;   // centre stage now the lead is gone
    $('readout').style.transform = 'translate(-50%, 0)';

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, (now - t0) / 1000);
    gl.uniform1f(uLevel, level); gl.uniform1f(uLow, low);
    gl.uniform1f(uHue, hue); gl.uniform1f(uInten, inten * (0.6 + 0.6 * expr) + 0.9 * drama);
    gl.uniform2f(uFall, slime.x / sl, slime.y / sl);
    gl.uniform2f(uStretch, slime.vx * 0.6, slime.vy * 0.6);
    bloom *= Math.exp(-dt / 0.9);
    rip[2] += dt;
    gl.uniform1f(uChaos, chaos);
    // ease the palette toward wherever the harmony is, slowly, so it drifts rather than flashes
    {
      const sl = slideNow, b0 = Math.floor(sl), fr = smooth(sl - b0);
      const A = PALS[((b0 % 8) + 8) % 8], B = PALS[(((b0 + 1) % 8) + 8) % 8];
      for (let k = 0; k < 6; k++) for (let j = 0; j < 3; j++) {
        const want = A[k][j] + (B[k][j] - A[k][j]) * fr;
        palNow[k][j] += (want - palNow[k][j]) * 0.035;
        palFlat[k * 3 + j] = palNow[k][j];
      }
      gl.uniform3fv(uPal, palFlat);
    }
    gl.uniform1f(uBloom, bloom); gl.uniform3f(uRip, rip[0], rip[1], rip[2]);
    // the word: "tilt" until you start, then the chord, upright in the real world
    wordBlur += (Math.min(Math.hypot(slime.vx, slime.vy) * 6, 5) - wordBlur) * 0.2;
    const started = !!ctx && !THUMB;
    if (started) {
      drawWord(wordNow, W / 2, H / 2, 0, Math.min(W * 0.085, 40));
    } else {
      drawWord('tilt', W / 2, THUMB ? H * 0.5 : H * 0.46 - Math.min(W * 0.24, 120) * 0.62, 0, Math.min(W * 0.24, THUMB ? H * 0.34 : 120));
    }
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ttex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);
    gl.uniform1i(uTxt, 0);
    let dgx = -slime.vx * 0.05, dgy = slime.vy * 0.05;
    const dm = Math.hypot(dgx, dgy); if (dm > 0.06) { dgx *= 0.06 / dm; dgy *= 0.06 / dm; }
    gl.uniform2f(uDrag, dgx, dgy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
