<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Poké-folio · Stefan Foster</title>
<meta name="description" content="Stefan Foster's portfolio as a small adventure. Walk the valley, find each project, beat it to see the work.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="game/rpg.css">
</head>
<body>
<main class="wrap">
  <div class="frame" id="frame">
    <canvas id="cv" width="320" height="180" aria-label="Poké-folio, a small adventure game"></canvas>
    <div class="ui">
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="hud" id="hud" hidden><button id="bmenu" type="button" aria-label="Menu"><i></i><i></i><i></i></button></div>
      <div class="stat foe" id="sfoe" hidden></div>
      <div class="stat me" id="sme" hidden></div>
      <div class="oak" id="oak" hidden><img id="oakimg" alt=""></div>
      <div class="dlg" id="dlg" hidden><b id="who" hidden></b><p id="txt" aria-live="polite"></p><i id="more" hidden>▼</i></div>
      <div class="menu" id="menu" hidden></div>
      <div class="title intro" id="title">
        <div class="tintro" aria-hidden="true"><p>STEFAN FOSTER</p><i>PRESENTS</i></div>
        <div class="tlogo">
          <h1 aria-label="Poké-folio"><span class="w1">POKÉ</span><span class="w2">FOLIO</span></h1>
        </div>
        <p class="tpress" id="tpress">PRESS START</p>
        <p class="tcopy">©2026 STEFAN FOSTER</p>
        <div class="tmenu" id="tmenu" hidden>
          <button id="bcont" type="button" hidden><b>CONTINUE</b><span id="tinfo"></span></button>
          <button id="bnew" type="button"><b>NEW GAME</b></button>
          <a class="tskip" href="./"><b>JUST SEE THE WORK</b></a>
        </div>
      </div>
      <div class="over" id="folio" hidden></div>
      <div class="over" id="card" hidden></div>
      <div class="over" id="wardrobe" hidden></div>
      <div class="over" id="board" hidden></div>
    </div>
  </div>
  <div class="pad" id="pad" aria-hidden="true">
    <div class="dp"><button data-k="up" class="u" type="button">▲</button><button data-k="left" class="l" type="button">◀</button><button data-k="right" class="r" type="button">▶</button><button data-k="down" class="d" type="button">▼</button></div>
    <div class="ab"><button data-k="b" class="b" type="button">B</button><button data-k="a" class="a" type="button">A</button></div>
    <div class="st"><button data-k="menu" type="button">MENU</button><button data-k="f" type="button">FOLIO</button></div>
  </div>
</main>
<script type="module" src="game/main.js"></script>
</body>
</html>
